<title>The Pulpit Index</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=IM+Fell+English:ital@0;1&display=swap">
<style>
:root {
  --bg: #f5f5f2;
  --surface: #ffffff;
  --surface-2: #efefeb;
  --surface-3: #e6e6e1;
  --ink: #141417;
  --ink-2: #55555e;
  --ink-3: #85858f;
  --line: #e2e2dc;
  --line-2: #d2d2cb;
  --focus: #2563eb;
  --ok: #1f7a4d;
  --scrim: rgba(12, 12, 14, 0.42);
  --shadow-1: 0 1px 2px rgba(20, 20, 23, 0.05);
  --shadow-2: 0 18px 40px -16px rgba(20, 20, 23, 0.22), 0 2px 8px rgba(20, 20, 23, 0.06);

  /* colours of the church year, one per group of subjects */
  --lit-heart: #b3223d;
  --lit-way: #5b3a98;
  --lit-hard: #2c2c33;
  --lit-last: #1d4e94;
  --lit-god: #d4a534;
  --lit-world: #2b7549;
  --on-lit: #ffffff;
  --on-god: #231904;

  /* preacher avatars, coloured by century */
  --era-0: #8a6841;
  --era-1: #3f5f8e;
  --era-2: #99473a;
  --era-3: #2f7867;
  --era-4: #a3582b;

  --hl-y: rgba(255, 204, 0, 0.42);
  --hl-g: rgba(52, 199, 89, 0.32);
  --hl-b: rgba(10, 132, 255, 0.26);
  --hl-p: rgba(255, 45, 85, 0.24);
  --hl-o: rgba(255, 149, 0, 0.34);
  --hl-line: 0px;

  /* reader: follows the app unless a page theme is chosen */
  --r-bg: var(--surface);
  --r-ink: var(--ink);
  --r-ink-2: var(--ink-2);
  --r-line: var(--line);
  --r-card: var(--surface-2);
  --r-accent: var(--lit-heart);
  --r-size: 19px;
  --r-lh: 1.75;
  --r-font: var(--f-read);

  --f-ui: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-read: "Literata", "Iowan Old Style", Georgia, "Times New Roman", serif;
  --f-period: "IM Fell English", "Palatino Linotype", Palatino, Georgia, serif;

  --r-md: 16px;
  --r-lg: 24px;
  --side: 248px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0b0b0d;
    --surface: #141417;
    --surface-2: #1b1b1f;
    --surface-3: #242429;
    --ink: #f1f1f3;
    --ink-2: #a4a4ae;
    --ink-3: #72727c;
    --line: #25252a;
    --line-2: #323238;
    --focus: #7aa7ff;
    --ok: #5cc28a;
    --scrim: rgba(0, 0, 0, 0.6);
    --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.4);
    --shadow-2: 0 18px 40px -12px rgba(0, 0, 0, 0.7), 0 2px 8px rgba(0, 0, 0, 0.4);
    --lit-heart: #a91f3a;
    --lit-way: #563895;
    --lit-hard: #33333b;
    --lit-last: #1c4a8d;
    --lit-god: #c99b2f;
    --lit-world: #286e45;
    --r-accent: #ff6b81;
    --hl-y: rgba(255, 210, 63, 0.2); --hl-g: rgba(92, 207, 124, 0.18); --hl-b: rgba(90, 162, 255, 0.2); --hl-p: rgba(255, 111, 145, 0.2); --hl-o: rgba(255, 169, 77, 0.2); --hl-line: 2px;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0b0b0d;
  --surface: #141417;
  --surface-2: #1b1b1f;
  --surface-3: #242429;
  --ink: #f1f1f3;
  --ink-2: #a4a4ae;
  --ink-3: #72727c;
  --line: #25252a;
  --line-2: #323238;
  --focus: #7aa7ff;
  --ok: #5cc28a;
  --scrim: rgba(0, 0, 0, 0.6);
  --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.4);
  --shadow-2: 0 18px 40px -12px rgba(0, 0, 0, 0.7), 0 2px 8px rgba(0, 0, 0, 0.4);
  --lit-heart: #a91f3a;
  --lit-way: #563895;
  --lit-hard: #33333b;
  --lit-last: #1c4a8d;
  --lit-god: #c99b2f;
  --lit-world: #286e45;
  --r-accent: #ff6b81;
  --hl-y: rgba(255, 210, 63, 0.2); --hl-g: rgba(92, 207, 124, 0.18); --hl-b: rgba(90, 162, 255, 0.2); --hl-p: rgba(255, 111, 145, 0.2); --hl-o: rgba(255, 169, 77, 0.2); --hl-line: 2px;
}
body[data-rtheme="light"] { --r-bg: #ffffff; --r-ink: #141417; --r-ink-2: #5a5a63; --r-line: #e4e4df; --r-card: #f3f3ef; --r-accent: #b3223d; --hl-y: rgba(255, 204, 0, 0.42); --hl-g: rgba(52, 199, 89, 0.32); --hl-b: rgba(10, 132, 255, 0.26); --hl-p: rgba(255, 45, 85, 0.24); --hl-o: rgba(255, 149, 0, 0.34); --hl-line: 0px; }
body[data-rtheme="sepia"] { --r-bg: #f4ecd8; --r-ink: #3a2e1f; --r-ink-2: #6f5f48; --r-line: #e0d2b2; --r-card: #ece1c6; --r-accent: #9b3417; --hl-y: rgba(255, 204, 0, 0.42); --hl-g: rgba(52, 199, 89, 0.32); --hl-b: rgba(10, 132, 255, 0.26); --hl-p: rgba(255, 45, 85, 0.24); --hl-o: rgba(255, 149, 0, 0.34); --hl-line: 0px; }
body[data-rtheme="dark"] { --r-bg: #1c1c1f; --r-ink: #e8e8ea; --r-ink-2: #9a9aa3; --r-line: #2e2e33; --r-card: #25252a; --r-accent: #ff7a8c; --hl-y: rgba(255, 210, 63, 0.2); --hl-g: rgba(92, 207, 124, 0.18); --hl-b: rgba(90, 162, 255, 0.2); --hl-p: rgba(255, 111, 145, 0.2); --hl-o: rgba(255, 169, 77, 0.2); --hl-line: 2px; }
body[data-rtheme="black"] { --r-bg: #000000; --r-ink: #d6d6d9; --r-ink-2: #85858d; --r-line: #1d1d20; --r-card: #111113; --r-accent: #ff7a8c; --hl-y: rgba(255, 210, 63, 0.2); --hl-g: rgba(92, 207, 124, 0.18); --hl-b: rgba(90, 162, 255, 0.2); --hl-p: rgba(255, 111, 145, 0.2); --hl-o: rgba(255, 169, 77, 0.2); --hl-line: 2px; }
body[data-rfont="sans"] { --r-font: var(--f-ui); }
body[data-rfont="period"] { --r-font: var(--f-period); }
body[data-rlh="compact"] { --r-lh: 1.55; }
body[data-rlh="relaxed"] { --r-lh: 2; }

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--f-ui); font-size: 15px; line-height: 1.55;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
.i { width: 20px; height: 20px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); margin: 0 0 10px; }
.tnum { font-variant-numeric: tabular-nums; }

/* ---------- app shell ---------- */
.sidebar {
  position: fixed; left: 0; top: 0; bottom: 0; width: var(--side); z-index: 20;
  padding: calc(20px + env(safe-area-inset-top, 0px)) 14px 20px;
  border-right: 1px solid var(--line); background: var(--bg);
  display: flex; flex-direction: column; gap: 22px;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 0 10px; font-weight: 700; font-size: 16px; letter-spacing: -0.02em; }
.brand-mark { width: 30px; height: 30px; border-radius: 9px; background: var(--ink); color: var(--bg); display: grid; place-items: center; font-family: var(--f-period); font-size: 20px; font-weight: 400; line-height: 1; padding-top: 2px; }
.brand small { display: block; font-weight: 500; font-size: 12px; color: var(--ink-3); letter-spacing: 0; }
.searchbtn {
  display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 12px; border-radius: 10px;
  background: var(--surface); border: 1px solid var(--line); color: var(--ink-3); font-size: 14px; box-shadow: var(--shadow-1);
}
.searchbtn:hover { border-color: var(--line-2); color: var(--ink-2); }
.searchbtn .i { width: 17px; height: 17px; }
kbd { margin-left: auto; font-family: var(--f-ui); font-size: 11px; color: var(--ink-3); border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; line-height: 18px; }
.snav { display: grid; gap: 2px; }
.snav a { display: flex; align-items: center; gap: 11px; padding: 9px 12px; border-radius: 10px; color: var(--ink-2); font-weight: 500; font-size: 14.5px; }
.snav a:hover { background: var(--surface-2); color: var(--ink); }
.snav a[aria-current="page"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-1), inset 0 0 0 1px var(--line); }
.snav .count { margin-left: auto; font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.side-foot { margin-top: auto; padding: 0 12px; font-size: 12px; color: var(--ink-3); line-height: 1.5; }

.app { margin-left: var(--side); min-height: 100vh; }
.topbar {
  position: sticky; top: 0; z-index: 15; display: none; align-items: center; gap: 8px;
  padding: calc(8px + env(safe-area-inset-top, 0px)) 12px 8px; background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: saturate(1.4) blur(14px); -webkit-backdrop-filter: saturate(1.4) blur(14px);
  border-bottom: 1px solid var(--line);
}
.topbar .brand { padding: 0 4px; font-size: 15px; }
.topbar .brand-mark { width: 26px; height: 26px; font-size: 17px; border-radius: 8px; }
.iconbtn { width: 40px; height: 40px; border-radius: 12px; display: inline-grid; place-items: center; color: var(--ink-2); flex: none; }
.iconbtn:hover { background: var(--surface-2); color: var(--ink); }
.view { max-width: 1080px; margin: 0 auto; padding: 36px 40px 96px; }

.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: none;
  padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px));
  background: color-mix(in srgb, var(--bg) 90%, transparent);
  backdrop-filter: saturate(1.4) blur(16px); -webkit-backdrop-filter: saturate(1.4) blur(16px);
  border-top: 1px solid var(--line);
}
.tabbar-in { display: grid; grid-template-columns: repeat(5, 1fr); max-width: 520px; margin: 0 auto; }
.tabbar a { display: grid; justify-items: center; gap: 2px; padding: 6px 0 4px; font-size: 11px; font-weight: 500; color: var(--ink-3); border-radius: 12px; }
.tabbar a .i { width: 22px; height: 22px; }
.tabbar a[aria-current="page"] { color: var(--ink); }
.tabbar a[aria-current="page"] .i { stroke-width: 2.1; }

body.reading .sidebar, body.reading .app, body.reading .tabbar { display: none; }

/* ---------- common blocks ---------- */
.section { margin-top: 44px; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.sec-head h2 { font-size: 20px; font-weight: 650; letter-spacing: -0.02em; margin: 0; }
.more-link { font-size: 14px; font-weight: 500; color: var(--ink-2); display: inline-flex; align-items: center; gap: 4px; }
.more-link:hover { color: var(--ink); }
.more-link .i { width: 16px; height: 16px; }
.page-title { font-size: clamp(30px, 4.4vw, 44px); font-weight: 700; letter-spacing: -0.035em; line-height: 1.05; margin: 0 0 10px; text-wrap: balance; }
.page-lede { font-size: 17px; color: var(--ink-2); max-width: 62ch; margin: 0; }
.crumb { display: inline-flex; align-items: center; gap: 4px; font-size: 13.5px; font-weight: 500; color: var(--ink-3); margin-bottom: 14px; }
.crumb:hover { color: var(--ink); }
.crumb .i { width: 16px; height: 16px; }

.seg { display: inline-flex; padding: 3px; gap: 2px; background: var(--surface-2); border-radius: 11px; border: 1px solid var(--line); max-width: 100%; overflow-x: auto; scrollbar-width: none; }
.seg button { padding: 6px 12px; border-radius: 8px; font-size: 13.5px; font-weight: 500; color: var(--ink-2); white-space: nowrap; }
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-1), 0 0 0 1px var(--line); }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; max-width: 100%; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px 5px 5px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 13.5px; font-weight: 500; color: var(--ink-2); white-space: nowrap; }
.chip.plain { padding-left: 12px; }
.chip:hover { border-color: var(--line-2); color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.chip .n { opacity: 0.6; font-variant-numeric: tabular-nums; }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin: 24px 0 18px; }
.toggle { display: inline-flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 500; color: var(--ink-2); user-select: none; }
.switch { width: 34px; height: 20px; border-radius: 999px; background: var(--line-2); position: relative; transition: background .2s; flex: none; }
.switch::after { content: ""; position: absolute; left: 2px; top: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .2s; }
[aria-checked="true"] .switch { background: var(--ok); }
[aria-checked="true"] .switch::after { transform: translateX(14px); }

/* avatars */
.av { display: inline-grid; place-items: center; flex: none; width: 28px; height: 28px; border-radius: 50%; color: #fff; font-weight: 600; font-size: 11px; letter-spacing: 0.02em; }
.av.md { width: 40px; height: 40px; font-size: 14px; }
.av.lg { width: 56px; height: 56px; font-size: 19px; }
.av.xl { width: 84px; height: 84px; font-size: 28px; letter-spacing: -0.01em; }
.era-0 { background: var(--era-0); } .era-1 { background: var(--era-1); } .era-2 { background: var(--era-2); } .era-3 { background: var(--era-3); } .era-4 { background: var(--era-4); }

/* ---------- home ---------- */
.hero { padding: 18px 0 6px; }
.hero h1 { font-size: clamp(38px, 6.2vw, 68px); font-weight: 700; letter-spacing: -0.045em; line-height: 0.98; margin: 0 0 18px; max-width: 13ch; text-wrap: balance; }
.hero h1 .serif { font-family: var(--f-read); font-weight: 400; font-style: italic; letter-spacing: -0.03em; }
.hero p { font-size: 18px; color: var(--ink-2); max-width: 58ch; margin: 0 0 24px; line-height: 1.5; }
.bigsearch { display: flex; align-items: center; gap: 12px; width: min(100%, 560px); padding: 14px 16px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-2); color: var(--ink-3); font-size: 16px; text-align: left; }
.bigsearch:hover { border-color: var(--line-2); }
.bigsearch span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stats { display: flex; flex-wrap: wrap; gap: 8px 22px; margin-top: 22px; font-size: 14px; color: var(--ink-2); }
.stats b { color: var(--ink); font-weight: 650; font-variant-numeric: tabular-nums; }
.stats .ok { display: inline-flex; align-items: center; gap: 6px; color: var(--ok); font-weight: 500; }
.stats .ok .i { width: 16px; height: 16px; }

.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.tile {
  position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; gap: 22px;
  min-height: 132px; padding: 16px 16px 14px; border-radius: var(--r-md); color: var(--on-lit);
  transition: transform .18s ease, box-shadow .18s ease;
}
.tile::after { content: ""; position: absolute; inset: 0; background: radial-gradient(120% 90% at 100% 0%, rgba(255,255,255,.2), transparent 55%); pointer-events: none; }
.tile:hover { box-shadow: var(--shadow-2); }
a.tile { background: var(--tb); }
.tile-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.stack { display: inline-flex; }
.stack .av { width: 24px; height: 24px; font-size: 9.5px; box-shadow: 0 0 0 2px var(--tb); }
.stack .av + .av { margin-left: -6px; }
.stack .av.more { background: rgba(255,255,255,.25); color: inherit; }
.tile.big .stack .av { width: 28px; height: 28px; font-size: 10.5px; }
.tile .nm { font-size: 22px; font-weight: 650; letter-spacing: -0.025em; line-height: 1.1; text-wrap: balance; }
.tile .ct { font-size: 13px; font-weight: 500; opacity: 0.85; font-variant-numeric: tabular-nums; }
.tile.big { min-height: 176px; }
.tile.big .nm { font-size: 30px; }
.tile[aria-disabled="true"] { opacity: 0.45; pointer-events: none; }
.lit-heart { background: var(--lit-heart); }
/* tiles use a per-subject shade of their group colour (set inline as --tb) */ .lit-way { background: var(--lit-way); } .lit-hard { background: var(--lit-hard); }
.lit-last { background: var(--lit-last); } .lit-world { background: var(--lit-world); }
.lit-god { background: var(--lit-god); color: var(--on-god); }
.group-block { margin-top: 34px; }
.group-block h3 { display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 600; margin: 0 0 12px; }
.group-block h3 i { width: 10px; height: 10px; border-radius: 3px; }

.hscroll { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(190px, 1fr); gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; padding: 2px 2px 8px; margin: -2px -2px 0; }
.hscroll::-webkit-scrollbar { display: none; }
.hscroll > * { scroll-snap-align: start; }
.pmini { display: grid; gap: 12px; align-content: start; padding: 16px; border-radius: var(--r-md); background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-1); transition: border-color .15s, transform .15s; }
.pmini:hover { border-color: var(--line-2); }
.pmini b { display: block; font-size: 15px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.25; }
.pmini span span { display: block; font-size: 13px; color: var(--ink-3); margin-top: 2px; }

.controw { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.cont { display: grid; gap: 8px; padding: 14px 16px; border-radius: var(--r-md); background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-1); text-align: left; }
.cont:hover { border-color: var(--line-2); }
.cont .t { font-family: var(--f-read); font-size: 17px; font-weight: 600; line-height: 1.25; }
.cont .w { font-size: 13px; color: var(--ink-3); display: flex; justify-content: space-between; gap: 8px; }
.meter { height: 4px; border-radius: 4px; background: var(--surface-3); overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: 4px; background: var(--ink); }

/* ---------- sermon cards ---------- */
.cards { display: grid; gap: 12px; }
.card {
  position: relative; display: grid; gap: 8px; padding: 18px 20px 16px; border-radius: var(--r-md);
  background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-1); cursor: pointer;
  transition: border-color .15s ease, box-shadow .15s ease;
}
.card:hover { border-color: var(--line-2); box-shadow: var(--shadow-2); }
.card-top { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-3); flex-wrap: wrap; }
.card-top .who { color: var(--ink-2); font-weight: 550; }
.card-top .who:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 550; background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); }
.pill.full { background: color-mix(in srgb, var(--ok) 12%, transparent); border-color: color-mix(in srgb, var(--ok) 28%, transparent); color: var(--ok); }
.pill .i { width: 13px; height: 13px; }
.card-top .pill { margin-left: auto; }
.card h3 { margin: 0; font-family: var(--f-read); font-size: 21px; font-weight: 600; line-height: 1.22; letter-spacing: -0.01em; text-wrap: balance; }
.card-sub { margin: 0; font-size: 13.5px; color: var(--ink-2); }
.card-sub i { font-family: var(--f-read); font-size: 14.5px; }
.card-sum { margin: 2px 0 0; font-size: 14.5px; color: var(--ink-2); line-height: 1.55; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; max-width: 75ch; }
.card-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; }
.tag { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px 3px 7px; border-radius: 7px; font-size: 12.5px; font-weight: 500; color: var(--ink-2); background: var(--surface-2); }
.tag:hover { color: var(--ink); background: var(--surface-3); }
.tag i { width: 7px; height: 7px; border-radius: 2px; }
.readcta { display: inline-flex; align-items: center; gap: 6px; font-size: 13.5px; font-weight: 600; color: var(--ink); padding: 6px 12px; border-radius: 9px; background: var(--surface-2); }
.card:hover .readcta { background: var(--ink); color: var(--bg); }
.readcta .i { width: 16px; height: 16px; }
.cards.compact .card { padding: 14px 16px; }
.cards.compact .card h3 { font-size: 18px; }
.cards.compact .card-sum { -webkit-line-clamp: 2; }

/* life strip */
.life { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 10px; font-size: 12.5px; color: var(--ink-3); }
.ll { display: inline-flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
.ll-track { position: relative; width: 104px; height: 6px; display: block; }
.ll-seg { position: absolute; top: 0; height: 100%; background: var(--surface-3); border-right: 1.5px solid var(--surface); }
.ll-seg:first-child { border-radius: 3px 0 0 3px; }
.ll-seg.on { background: var(--ink-3); }
.ll-dot { position: absolute; top: 50%; width: 11px; height: 11px; margin: -5.5px 0 0 -5.5px; border-radius: 50%; background: var(--ink); box-shadow: 0 0 0 2.5px var(--surface); }
.life b { color: var(--ink-2); font-weight: 600; }

/* ---------- subject + preacher headers ---------- */
.band { position: relative; overflow: hidden; border-radius: var(--r-lg); padding: 28px 30px 26px; color: var(--on-lit); margin-bottom: 4px; }
.band::after { content: ""; position: absolute; inset: 0; background: radial-gradient(90% 120% at 100% 0%, rgba(255,255,255,.18), transparent 60%); pointer-events: none; }
.band.lit-god { color: var(--on-god); }
.band .crumb { color: inherit; opacity: 0.78; position: relative; z-index: 1; }
.band .crumb:hover { color: inherit; opacity: 1; }
.band h1 { font-size: clamp(34px, 5vw, 52px); font-weight: 700; letter-spacing: -0.04em; line-height: 1; margin: 0 0 10px; }
.band p { margin: 0; max-width: 60ch; font-size: 16px; opacity: 0.9; }
.band .g { font-size: 12px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; opacity: 0.78; margin-bottom: 8px; }
.band .ct { margin-top: 14px; font-size: 14px; font-weight: 550; opacity: 0.9; }

.p-hero { display: grid; gap: 18px; }
.p-id { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
.p-id h1 { font-size: clamp(30px, 4.6vw, 46px); font-weight: 700; letter-spacing: -0.04em; line-height: 1.02; margin: 0 0 6px; }
.p-id p { margin: 0; color: var(--ink-2); font-size: 15.5px; }
.p-id .era { font-size: 13px; color: var(--ink-3); margin-top: 4px; }

.pgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.pcard { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px; align-items: start; padding: 18px; border-radius: var(--r-md); background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-1); transition: border-color .15s, box-shadow .15s; }
.pcard:hover { border-color: var(--line-2); box-shadow: var(--shadow-2); }
.pcard h3 { font-size: 16px; font-weight: 650; letter-spacing: -0.015em; margin: 0; }
.pcard .yrs { font-size: 13px; color: var(--ink-3); margin: 1px 0 6px; font-variant-numeric: tabular-nums; }
.pcard .role { font-size: 13.5px; color: var(--ink-2); margin: 0; line-height: 1.45; }
.pcard .n { font-size: 12.5px; font-weight: 600; color: var(--ink); margin-top: 10px; display: inline-flex; gap: 10px; }
.pcard .n span { color: var(--ink-3); font-weight: 500; }

/* life tab */
.lifebar { padding: 18px 20px 16px; border-radius: var(--r-md); background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-1); margin-top: 22px; }
.lb-wrap { position: relative; padding-top: 22px; }
.lb-track { position: relative; height: 40px; }
.lb-seg { position: absolute; top: 0; height: 100%; background: color-mix(in srgb, var(--ink) 7%, var(--surface)); border-right: 2px solid var(--surface); display: flex; align-items: center; padding: 0 9px; font-size: 12px; font-weight: 500; color: var(--ink-2); overflow: hidden; white-space: nowrap; text-align: left; }
.lb-seg:nth-child(even) { background: color-mix(in srgb, var(--ink) 14%, var(--surface)); }
.lb-seg:first-child { border-radius: 9px 0 0 9px; }
.lb-seg.last { border-radius: 0 9px 9px 0; border-right: 0; }
.lb-seg:hover { color: var(--ink); }
.lb-seg span { overflow: hidden; text-overflow: ellipsis; }
.lb-tick { position: absolute; bottom: 4px; width: 2px; height: 9px; border-radius: 1px; background: var(--ink-3); opacity: 0.55; pointer-events: none; }
.lb-dot { position: absolute; top: -17px; width: 11px; height: 11px; margin-left: -5.5px; border-radius: 50%; background: var(--lit-heart); box-shadow: 0 0 0 2px var(--surface); }
.lb-dot::after { content: ""; position: absolute; left: 50%; top: 100%; width: 1.5px; height: 8px; margin-left: -0.75px; background: color-mix(in srgb, var(--lit-heart) 60%, transparent); }
.lb-dot:hover { transform: scale(1.25); }
.lb-years { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--ink-3); margin-top: 8px; font-variant-numeric: tabular-nums; }
.lb-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12.5px; color: var(--ink-3); margin-top: 6px; }
.lb-legend i { display: inline-block; vertical-align: -1px; margin-right: 6px; width: 10px; height: 10px; border-radius: 50%; background: var(--lit-heart); }
.lb-legend i.t { width: 2px; height: 10px; border-radius: 1px; background: var(--ink-3); }

.stages { list-style: none; margin: 26px 0 0; padding: 0; }
.stage { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 0 16px; scroll-margin-top: 80px; }
.stage-rail { position: relative; }
.stage-rail::before { content: ""; position: absolute; left: 10px; top: 0; bottom: 0; width: 2px; background: var(--line); }
.stage:first-child .stage-rail::before { top: 14px; }
.stage:last-child .stage-rail::before { bottom: auto; height: 14px; }
.stage-dot { position: absolute; left: 4px; top: 8px; width: 14px; height: 14px; border-radius: 50%; background: var(--bg); border: 2.5px solid var(--ink); }
.stage-body { padding-bottom: 34px; min-width: 0; }
.stage-years { font-size: 13px; font-weight: 600; color: var(--ink-3); font-variant-numeric: tabular-nums; margin: 3px 0 2px; }
.stage h3 { font-size: 20px; font-weight: 650; letter-spacing: -0.02em; margin: 0 0 6px; }
.stage p.sum { margin: 0 0 12px; color: var(--ink-2); max-width: 68ch; }
.evs { list-style: none; margin: 0 0 14px; padding: 0; display: grid; gap: 6px; }
.evs li { display: grid; grid-template-columns: 7.5rem minmax(0, 1fr); gap: 12px; font-size: 14px; color: var(--ink-2); }
.evs time { font-size: 13px; color: var(--ink-3); font-variant-numeric: tabular-nums; padding-top: 1px; }
.none { font-size: 13.5px; color: var(--ink-3); margin: 0; }

.about-grid { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 18px; margin-top: 22px; }
.panel { padding: 20px 22px; border-radius: var(--r-md); background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-1); }
.panel h3 { font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); margin: 0 0 8px; }
.panel p { margin: 0 0 12px; }
.panel ul { margin: 0; padding-left: 18px; }
.panel li { margin-bottom: 4px; overflow-wrap: anywhere; }
.panel a { text-decoration: underline; text-decoration-color: var(--line-2); text-underline-offset: 3px; }
.panel a:hover { text-decoration-color: currentColor; }
.bd { display: grid; gap: 4px; font-size: 14px; color: var(--ink-2); }

/* saved + about */
.saved-group { padding: 16px 18px; border-radius: var(--r-md); background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-1); }
.saved-group h3 { font-family: var(--f-read); font-size: 18px; font-weight: 600; margin: 0; }
.saved-group .w { font-size: 13px; color: var(--ink-3); margin: 2px 0 8px; }
.mark { display: block; width: 100%; text-align: left; padding: 8px 12px; margin-top: 6px; border-radius: 10px; font-family: var(--f-read); font-size: 15px; line-height: 1.5; }
.mark small { font-family: var(--f-ui); font-size: 12px; color: var(--ink-3); margin-left: 6px; }
.mark.c-y { background: var(--hl-y); } .mark.c-g { background: var(--hl-g); } .mark.c-b { background: var(--hl-b); } .mark.c-p { background: var(--hl-p); } .mark.c-o { background: var(--hl-o); }
.mark.note { background: var(--surface-2); font-family: var(--f-ui); font-size: 14.5px; }
.mark.note q { display: block; font-family: var(--f-read); color: var(--ink-3); font-size: 13.5px; margin-top: 4px; quotes: none; }
.empty { padding: 36px 24px; text-align: center; border: 1.5px dashed var(--line-2); border-radius: var(--r-md); color: var(--ink-3); }
.empty b { display: block; color: var(--ink); font-size: 16px; margin-bottom: 4px; }
.method { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 22px; }
@media (max-width: 1100px) { .method { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.method .panel h4 { font-size: 16px; font-weight: 650; margin: 0 0 6px; letter-spacing: -0.01em; }
.method .panel p { color: var(--ink-2); margin: 0; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 13.5px; color: var(--ink-2); margin-top: 8px; }
.legend span { display: inline-flex; align-items: center; gap: 7px; }
.legend i { width: 12px; height: 12px; border-radius: 4px; }

/* ================= READER ================= */
.reader { min-height: 100vh; background: var(--r-bg); color: var(--r-ink); }
body.reading { background: var(--r-bg); }
.rbar { position: sticky; top: 0; z-index: 25; background: color-mix(in srgb, var(--r-bg) 90%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid transparent; padding-top: env(safe-area-inset-top, 0px); transition: border-color .2s; }
.rbar.scrolled { border-bottom-color: var(--r-line); }
.rbar-in { max-width: 860px; margin: 0 auto; display: flex; align-items: center; gap: 2px; height: 54px; padding: 0 8px; }
.rbar .iconbtn { color: var(--r-ink-2); }
.rbar .iconbtn:hover { background: var(--r-card); color: var(--r-ink); }
.rbar .iconbtn[aria-pressed="true"] { color: var(--r-accent); }
.rbar .iconbtn[aria-pressed="true"] .i { fill: currentColor; }
.rbar-t { flex: 1; min-width: 0; text-align: center; font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: 0; transition: opacity .2s; padding: 0 6px; }
.rbar.scrolled .rbar-t { opacity: 1; }
.rbar-t span { font-weight: 400; color: var(--r-ink-2); }
.aa { font-family: var(--f-read); font-size: 18px; font-weight: 600; }
.rchap { font-size: 13px; color: var(--r-ink); background: var(--r-card); border: 1px solid var(--r-line); border-radius: 9px; padding: 6px 8px; max-width: 10rem; }
.rprog { position: absolute; left: 0; bottom: -1px; height: 2px; width: 0; background: var(--r-accent); }

.rpanel {
  position: fixed; z-index: 45; right: max(12px, calc(50vw - 420px)); top: calc(60px + env(safe-area-inset-top, 0px)); width: min(340px, calc(100vw - 24px));
  background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow-2);
  padding: 16px; display: grid; gap: 16px;
}
.rp-l { font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); margin: 0 0 8px; }
.rp-row input[type="range"] { flex: 1; accent-color: var(--ink); }
.rp-size { display: flex; align-items: center; gap: 12px; }
.rp-size span { font-family: var(--f-read); color: var(--ink-2); }
.themes { display: flex; gap: 10px; flex-wrap: wrap; }
.themes button { display: grid; justify-items: center; gap: 5px; font-size: 11.5px; color: var(--ink-2); }
.themes .sw { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line-2); display: grid; place-items: center; font-family: var(--f-read); font-size: 15px; }
.themes button[aria-pressed="true"] .sw { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--ink); }
.sw-auto { background: linear-gradient(135deg, #ffffff 50%, #1c1c1f 50%); color: transparent; }
.sw-light { background: #fff; color: #141417; } .sw-sepia { background: #f4ecd8; color: #3a2e1f; } .sw-dark { background: #1c1c1f; color: #e8e8ea; } .sw-black { background: #000; color: #d6d6d9; }
.rpanel .seg { display: flex; }
.rpanel .seg button { flex: 1; }
.rp-toggle { display: flex; align-items: center; justify-content: space-between; font-size: 14px; font-weight: 500; }

.rcol { max-width: 680px; margin: 0 auto; padding: 36px 24px 140px; }
.r-who { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: var(--r-ink-2); padding: 4px 12px 4px 4px; border-radius: 999px; background: var(--r-card); }
.r-who:hover { color: var(--r-ink); }
.r-title { font-family: var(--f-read); font-size: clamp(32px, 6.4vw, 48px); font-weight: 600; letter-spacing: -0.02em; line-height: 1.08; margin: 16px 0 14px; text-wrap: balance; }
.r-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; font-size: 13.5px; color: var(--r-ink-2); }
.r-meta { column-gap: 18px; }
.r-meta > span { position: relative; }
.scripture { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 999px; background: var(--r-accent); color: #fff; font-weight: 600; font-size: 13.5px; }
.scripture .i { width: 15px; height: 15px; }
.scripture:hover { filter: brightness(1.08); }
.reader .life { margin-top: 14px; color: var(--r-ink-2); }
.reader .life b { color: var(--r-ink); }
.reader .ll-seg { background: var(--r-line); border-right-color: var(--r-bg); }
.reader .ll-seg.on { background: var(--r-ink-2); }
.reader .ll-dot { background: var(--r-accent); box-shadow: 0 0 0 2.5px var(--r-bg); }

.ctxcard { margin: 26px 0 34px; border-radius: 18px; background: var(--r-card); border: 1px solid var(--r-line); overflow: hidden; }
.ctx-tabs { display: flex; gap: 2px; padding: 6px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--r-line); }
.ctx-tabs::-webkit-scrollbar { display: none; }
.ctx-tabs button { flex: none; padding: 7px 12px; border-radius: 10px; font-size: 13.5px; font-weight: 550; color: var(--r-ink-2); white-space: nowrap; }
.ctx-tabs button:hover { color: var(--r-ink); }
.ctx-tabs button[aria-selected="true"] { background: var(--r-bg); color: var(--r-ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.ctx-tabs .collapse { margin-left: auto; }
.ctx-body { padding: 16px 18px 18px; font-size: 15.5px; line-height: 1.65; }
.ctx-body p { margin: 0 0 10px; }
.ctx-body p:last-child { margin-bottom: 0; }
.ctxcard.closed .ctx-body { display: none; }
.ctxcard.closed .ctx-tabs { border-bottom: 0; }
.facts { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 16px; margin: 0 0 14px; font-size: 14px; }
.facts dt { color: var(--r-ink-2); }
.facts dd { margin: 0; }
.facts .nr { color: var(--r-ink-2); font-style: italic; opacity: .8; }
.ctx-body ol { margin: 0; padding-left: 20px; font-size: 14px; }
.ctx-body ol li { margin-bottom: 4px; overflow-wrap: anywhere; }
.ctx-body a { text-decoration: underline; text-decoration-color: var(--r-line); text-underline-offset: 3px; }
.ctx-body a:hover { text-decoration-color: currentColor; }
.check { display: flex; gap: 8px; align-items: flex-start; font-size: 13.5px; color: var(--r-ink-2); margin-top: 12px; }
.check .i { color: var(--ok); width: 17px; height: 17px; margin-top: 2px; }
.notest { font-size: 13.5px; color: var(--r-ink-2); margin-top: 10px; padding: 10px 12px; border-radius: 10px; background: var(--r-bg); }

.r-body { font-family: var(--r-font); font-size: var(--r-size); line-height: var(--r-lh); }
body[data-rfont="period"] .r-body { font-size: calc(var(--r-size) * 1.06); }
.r-body h2.chap { font-family: var(--f-read); font-size: 1.35em; font-weight: 600; text-align: center; margin: 0 0 1.2em; line-height: 1.25; }
.r-body h3 { font-family: var(--f-ui); font-size: 0.82em; font-weight: 650; letter-spacing: 0.02em; margin: 2.2em 0 0.9em; color: var(--r-ink); line-height: 1.4; }
.r-body p { margin: 0 0 1.05em; }
.r-body p.q { padding-left: 1.2em; border-left: 2px solid var(--r-line); }
.r-body p.poem { white-space: pre-line; font-style: italic; padding-left: 1.4em; }
.v { cursor: pointer; border-radius: 4px; padding: 0.06em 0; -webkit-box-decoration-break: clone; box-decoration-break: clone; transition: background-color .15s; -webkit-tap-highlight-color: transparent; }
@media (hover: hover) { .v:hover { background-color: color-mix(in srgb, var(--r-ink) 5%, transparent); } }
.v.sel { text-decoration: underline dotted; text-decoration-color: var(--r-accent); text-decoration-thickness: 2px; text-underline-offset: 0.3em; }
.v.hl-y { --hlc: var(--hl-y); --hll: #ffd23f; } .v.hl-g { --hlc: var(--hl-g); --hll: #5ccf7c; } .v.hl-b { --hlc: var(--hl-b); --hll: #5aa2ff; }
.v.hl-p { --hlc: var(--hl-p); --hll: #ff6f91; } .v.hl-o { --hlc: var(--hl-o); --hll: #ffa94d; }
.v[class*="hl-"] { background-image: linear-gradient(var(--hlc), var(--hlc)); box-shadow: inset 0 calc(-1 * var(--hl-line)) 0 var(--hll); }
.vn { font-family: var(--f-ui); font-size: 0.56em; font-weight: 600; color: var(--r-accent); vertical-align: 0.55em; line-height: 0; margin: 0 0.25em 0 0.1em; user-select: none; -webkit-user-select: none; font-variant-numeric: tabular-nums; }
body[data-vnum="off"] .vn { display: none; }
.nmark { display: inline-grid; place-items: center; width: 1.25em; height: 1.25em; vertical-align: -0.15em; margin-left: 0.15em; border-radius: 5px; color: var(--r-accent); background: color-mix(in srgb, var(--r-accent) 14%, transparent); }
.nmark .i { width: 0.8em; height: 0.8em; stroke-width: 2.2; }
.r-loading { color: var(--r-ink-2); font-family: var(--f-ui); font-size: 14px; }
.locked { padding: 22px; border-radius: 18px; border: 1px dashed var(--r-line); font-family: var(--f-ui); font-size: 15px; line-height: 1.6; }
.locked h3 { font-size: 18px; font-weight: 650; margin: 0 0 6px; letter-spacing: -0.01em; }
.locked p { margin: 0 0 14px; color: var(--r-ink-2); }
.btnrow { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { display: inline-flex; align-items: center; gap: 7px; padding: 9px 14px; border-radius: 11px; font-size: 14px; font-weight: 600; background: var(--r-ink); color: var(--r-bg); }
.btn:hover { opacity: .9; }
.btn.ghost { background: transparent; color: var(--r-ink); box-shadow: inset 0 0 0 1px var(--r-line); }
.btn .i { width: 16px; height: 16px; }
.chapnav { display: flex; justify-content: space-between; gap: 10px; margin-top: 30px; font-family: var(--f-ui); }
.r-src { margin-top: 42px; padding-top: 16px; border-top: 1px solid var(--r-line); font-family: var(--f-ui); font-size: 13px; color: var(--r-ink-2); line-height: 1.6; }
.r-src a { text-decoration: underline; text-underline-offset: 3px; }
.r-next { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 22px; font-family: var(--f-ui); }
.r-next button { display: grid; gap: 3px; text-align: left; padding: 14px 16px; border-radius: 14px; background: var(--r-card); border: 1px solid var(--r-line); min-width: 0; }
.r-next button:hover { border-color: var(--r-ink-2); }
.r-next .d { font-size: 12px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--r-ink-2); }
.r-next .t { font-family: var(--f-read); font-size: 17px; font-weight: 600; line-height: 1.25; overflow-wrap: anywhere; }
.r-next .w { font-size: 12.5px; color: var(--r-ink-2); }
.r-next .nx { text-align: right; }

/* verse action sheet */
.sheet {
  position: fixed; left: 50%; bottom: 0; z-index: 40; transform: translateX(-50%); width: min(560px, 100%);
  padding: 10px 16px calc(14px + env(safe-area-inset-bottom, 0px)); background: var(--surface); color: var(--ink);
  border: 1px solid var(--line); border-bottom: 0; border-radius: 22px 22px 0 0; box-shadow: var(--shadow-2);
  animation: up .22s cubic-bezier(.2,.8,.2,1);
}
@keyframes up { from { transform: translate(-50%, 24px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }

<script type="application/json" id="library-data">/*__DATA__*/</script>
<script type="application/json" id="texts-inline">/*__TEXTS__*/</script>
<script>
(function () {
  "use strict";
  var DATA = JSON.parse(document.getElementById("library-data").textContent);
  var INLINE = null;
  try { var raw = document.getElementById("texts-inline").textContent.trim(); if (raw.charAt(0) === "{") INLINE = JSON.parse(raw); } catch (e) {}

  var CATS = DATA.categories, GROUPS = DATA.groups, SERMONS = DATA.sermons, PREACHERS = DATA.preachers;
  var catById = {}, groupById = {}, preacherById = {}, sermonById = {};
  CATS.forEach(function (c) { catById[c.id] = c; });
  GROUPS.forEach(function (g) { groupById[g.id] = g; });
  PREACHERS.forEach(function (p) { preacherById[p.id] = p; });
  SERMONS.forEach(function (s) { sermonById[s.id] = s; });
  var PRIORITY = ["love", "friendship", "hatred-enemies", "forgiveness"];
  var TYPE = { sermon: "Sermon", homily: "Homily", address: "Address", broadcast: "Broadcast", lecture: "Lecture", "sermon-series": "Series" };
  var ERA_LABELS = ["4th–5th century", "16th century", "18th century", "19th century", "20th century"];
  var reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ---------- storage: per-viewer conveniences only ---------- */
  var store = {
    get: function (k, d) { try { var v = localStorage.getItem("pulpit:" + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem("pulpit:" + k, JSON.stringify(v)); } catch (e) {} }
  };
  var rs = Object.assign({ size: 19, theme: "auto", font: "serif", lh: "normal", vnum: true }, store.get("reader2", {}));
  var marks = store.get("marks", {});
  var notes = store.get("notes", {});
  var bookmarks = store.get("bookmarks", {});
  var progress = store.get("progress", {});
  var ui = Object.assign({ sort: "date", fullOnly: false, ctxTab: "life", ctxOpen: true }, store.get("ui", {}));
  function saveUi() { store.set("ui", ui); }

  /* ---------- helpers ---------- */
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function safeUrl(u) { return /^https?:\/\//i.test(u || "") ? u : ""; }
  function icon(n) { return '<svg class="i" aria-hidden="true"><use href="#i-' + n + '"/></svg>'; }
  function av(p, cls) { return '<span class="av era-' + p.era + (cls ? " " + cls : "") + '" aria-hidden="true">' + esc(p.monogram) + '</span>'; }
  function catsOf(s) { var o = [s.primary_category]; (s.categories || []).forEach(function (c) { if (o.indexOf(c) < 0) o.push(c); }); return o.filter(function (c) { return catById[c]; }); }
  function sortKey(s) {
    var m = /^(\d{1,4})(?:-(\d{2}))?(?:-(\d{2}))?/.exec(s.date_iso || "");
    if (m) return (+m[1]) * 10000 + (+(m[2] || 0)) * 100 + (+(m[3] || 0));
    return preacherById[s.preacher_id].sort_year * 10000 + 9999;
  }
  function byDate(a, b) { return sortKey(a) - sortKey(b); }
  function poss(n) { return n + (/s$/.test(n) ? "’" : "’s"); }
  function mins(s) { return s.words ? Math.max(1, Math.round(s.words / 230)) + " min" : ""; }
  function bibleLink(r) { return "https://www.biblegateway.com/passage/?search=" + encodeURIComponent(r) + "&version=KJV"; }
  function plural(n, w) { return n + " " + w + (n === 1 ? "" : "s"); }
  function linkList(ls) { return (ls || []).filter(function (l) { return safeUrl(l.url); }).map(function (l) { return '<li><a href="' + esc(l.url) + '" target="_blank" rel="noopener">' + esc(l.label) + '</a></li>'; }).join(""); }
  function toast(m) { var t = document.getElementById("toast"); t.textContent = m; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(function () { t.hidden = true; }, 1700); }
  function countIn(catId) { return SERMONS.filter(function (s) { return catsOf(s).indexOf(catId) >= 0; }); }
  function savedTotal() { var n = 0; Object.keys(marks).forEach(function (k) { n += Object.keys(marks[k]).length; }); Object.keys(notes).forEach(function (k) { n += Object.keys(notes[k]).length; }); return n + Object.keys(bookmarks).length; }
  function each(sel, fn) { Array.prototype.forEach.call(document.querySelectorAll(sel), fn); }

  var nTexts = SERMONS.filter(function (s) { return s.has_text; }).length;
  document.getElementById("c-subjects").textContent = CATS.filter(function (c) { return countIn(c.id).length; }).length;
  document.getElementById("c-preachers").textContent = PREACHERS.length;
  document.getElementById("side-foot").textContent = SERMONS.length + " sermons · " + nTexts + " full texts · compiled " + DATA.generated;
  function refreshSavedCount() { var n = savedTotal(); document.getElementById("c-saved").textContent = n ? n : ""; }
  refreshSavedCount();

  /* ---------- components ---------- */
  function lifeStrip(s) {
    var p = preacherById[s.preacher_id], L = p.life;
    if (!L || s.life_pos == null) return s.age_text ? '<div class="life"><b>' + esc(s.age_text) + '</b></div>' : "";
    var segs = L.phases.map(function (ph, i) {
      return '<span class="ll-seg' + (i === s.phase_idx ? " on" : "") + '" style="left:' + (ph.a * 100).toFixed(2) + '%;width:' + ((ph.b - ph.a) * 100).toFixed(2) + '%"></span>';
    }).join("");
    var ph = L.phases[s.phase_idx];
    return '<div class="life"><span class="ll" aria-hidden="true">' + esc(L.born_label) + '<span class="ll-track">' + segs +
      '<span class="ll-dot" style="left:' + (s.life_pos * 100).toFixed(2) + '%"></span></span>' + esc(L.died_label) + '</span>' +
      '<span>' + (s.age_text ? '<b>' + esc(s.age_text) + '</b>' : '') + (ph ? (s.age_text ? ' · ' : '') + esc(ph.label) : '') + '</span></div>';
  }
  function lifeText(s) {
    if (s.life_context) return s.life_context;
    var L = preacherById[s.preacher_id].life, ph = L && L.phases[s.phase_idx];
    return ph ? ph.summary : "";
  }
  function tagHtml(c) { var cat = catById[c]; return '<a class="tag" href="#s-' + c + '"><i class="lit-' + cat.group + '"></i>' + esc(cat.label) + '</a>'; }
  function card(s) {
    var p = preacherById[s.preacher_id];
    var sub = [s.scripture ? '<i>' + esc(s.scripture) + '</i>' : "", esc(s.place)].filter(Boolean).join(" · ");
    return '<article class="card" data-open="' + esc(s.id) + '">' +
      '<div class="card-top">' + av(p) + '<a class="who" href="#p-' + p.id + '">' + esc(p.name) + '</a><span>·</span><span class="tnum">' + (s.date_text ? esc(s.date_text) : "Date not recorded") + '</span>' +
        (s.has_text ? '<span class="pill full">' + icon("book") + 'Full text</span>' : '<span class="pill">' + (s.copyright === "in-copyright" ? "In copyright" : "Summary") + '</span>') + '</div>' +
      '<h3><a href="#read-' + esc(s.id) + '">' + esc(s.title) + '</a></h3>' +
      (sub ? '<p class="card-sub">' + sub + '</p>' : '') +
      '<p class="card-sum">' + esc(s.summary) + '</p>' +
      lifeStrip(s) +
      '<div class="card-foot"><div class="tags">' + catsOf(s).map(tagHtml).join("") + '</div>' +
        '<span class="readcta">' + (s.has_text ? icon("book") + 'Read' + (s.words ? ' · ' + mins(s) : '') : 'Context') + '</span></div>' +
      '</article>';
  }
  function tileBg(c) {
    var sibs = CATS.filter(function (x) { return x.group === c.group; }), i = sibs.indexOf(c);
    var amt = [0, 13, 24, 33, 41, 48, 54][i] || 0;
    return "color-mix(in srgb, var(--lit-" + c.group + "), " + (c.group === "god" ? "#fff " : "#000 ") + amt + "%)";
  }
  function tile(c, big) {
    var list = countIn(c.id), n = list.length;
    var who = PREACHERS.filter(function (p) { return list.some(function (s) { return s.preacher_id === p.id; }); });
    var stack = who.slice(0, 5).map(function (p) { return av(p); }).join("") + (who.length > 5 ? '<span class="av more">+' + (who.length - 5) + '</span>' : '');
    return '<a class="tile lit-' + c.group + (big ? " big" : "") + '" style="--tb:' + tileBg(c) + '" href="#s-' + c.id + '"' + (n ? '' : ' aria-disabled="true"') + '>' +
      '<span class="nm">' + esc(c.label) + '</span><span class="tile-foot"><span class="stack">' + stack + '</span><span class="ct">' + plural(n, "sermon") + '</span></span></a>';
  }

  /* ---------- views ---------- */
  var VIEWS = {};
  var queue = [];

  VIEWS.home = function () {
    var cont = Object.keys(progress).filter(function (id) { return sermonById[id] && progress[id].pct < 0.97; })
      .sort(function (a, b) { return progress[b].t - progress[a].t; }).slice(0, 3);
    var readable = [];
    PRIORITY.forEach(function (c) {
      countIn(c).filter(function (s) { return s.has_text; }).sort(byDate).slice(0, 2).forEach(function (s) { if (readable.indexOf(s) < 0) readable.push(s); });
    });
    if (readable.length < 4) SERMONS.filter(function (s) { return s.has_text && readable.indexOf(s) < 0; }).slice(0, 6 - readable.length).forEach(function (s) { readable.push(s); });
    queue = readable.map(function (s) { return s.id; });
    var first = PREACHERS[0], last = PREACHERS[PREACHERS.length - 1];
    return '<section class="hero">' +
      '<p class="eyebrow">The Pulpit Index</p>' +
      '<h1><span class="line"><span>Great sermons,</span></span><span class="line"><span class="serif">read in context.</span></span></h1>' +
      '<p>Sermons by ' + PREACHERS.length + ' preachers, from ' + esc(first.name) + ' to ' + esc(last.name) + ', sorted by what they are about. Each one says when and where it was preached, what it argues, and where the preacher was in life. Public-domain sermons can be read in full or listened to, verse by verse.</p>' +

  function validKeys(a) { return Array.isArray(a) && a.length && a.length < 300 && a.every(function (k) { return typeof k === "string" && /^\d{1,3}\.\d{1,5}$/.test(k); }) ? a.slice() : null; }
  function friendNotesFor(sid) {

  function resolveProfiles() {

  var socialSubs = [];

  function startSocial(db, user, me) {

  function initSocial() {

  function refreshFriendSubs() {

    else { var el = document.querySelector('#r-body [data-k="' + key + '"]'); if (el) { el.scrollIntoView({ block: "center", behavior: reduced ? "auto" : "smooth" }); el.classList.add("sel"); setTimeout(function () { el.classList.remove("sel"); }, 1400); } }

  function mergeMyShared(snap) {

  var shareTimer = 0, writeQ = Promise.resolve();

    socialRender();

  function genCode() { var a = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789", out = "", r = new Uint32Array(6); crypto.getRandomValues(r); for (var i = 0; i < 6; i++) out += a[r[i] % a.length]; return out; }
